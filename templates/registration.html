{% extends "layout.html" %}
{% block title %}Registration - Enterprise KYC Onboarding{% endblock %}
{% block step_name %}User Registration{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="space-y-1">
        <h2 class="text-xl font-bold text-gray-900">Personal Information</h2>
        <p class="text-xs text-gray-500">Please enter your details exactly as they appear on your legal identity documents.</p>
    </div>

    <form method="POST" action="/registration" class="space-y-4">
        <div>
            <label for="fullname" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Full Legal Name</label>
            <input type="text" name="fullname" id="fullname" required placeholder="John Doe" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm transition duration-150" value="{{ form_data.fullname or '' }}">
        </div>

        <div>
            <label for="dob" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Date of Birth</label>
            <input type="date" name="dob" id="dob" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm transition duration-150" value="{{ form_data.dob or '' }}">
        </div>

        <div>
            <label for="address" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Residential Address</label>
            <textarea name="address" id="address" required rows="2" placeholder="123 Main St, New York, NY 10001" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm transition duration-150">{{ form_data.address or '' }}</textarea>
        </div>

        <div>
            <label for="email" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Email Address</label>
            <input type="email" name="email" id="email" required placeholder="john.doe@example.com" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm transition duration-150" value="{{ form_data.email or '' }}">
        </div>

        <button type="submit" class="w-full inline-flex items-center justify-center px-5 py-3 border border-transparent text-sm font-semibold rounded-xl text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150 pt-2">
            Continue to MFA Setup
            <i data-lucide="shield" class="ml-2 w-4 h-4"></i>
        </button>
    </form>
</div>
{% endblock %}
