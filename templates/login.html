{% extends "base.html" %}
{% block title %}User Login - BDCN Platform{% endblock %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-danger text-white text-center py-3">
                <h4 class="mb-0">🩸 BDCN Portal Login</h4>
            </div>
            <div class="card-body p-4">
                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username or Email</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username or email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <div class="mb-3">
                        <label for="role" class="form-label">Role / Account Type</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="hospital" selected>ER Coordinator / Hospital Staff</option>
                            <option value="admin">System Administrator</option>
                            <option value="donor">Voluntary Blood Donor</option>
                        </select>
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-danger btn-lg">Log In</button>
                    </div>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-3 text-muted small">
                Authorized Personnel Only &bull; Encrypted TLS 1.3
            </div>
        </div>
    </div>
</div>
{% endblock %}
