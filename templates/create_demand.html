{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Create Blood Request Demand</h2>
    <form method="POST">
        <p><label>Blood Type: 
            <select name="blood_type">
                <option value="A+">A+</option>
                <option value="O-">O-</option>
                <option value="B+">B+</option>
            </select>
        </label></p>
        <p><label>Units Needed: <input type="number" name="units_needed" value="1" min="1"></label></p>
        <p><label>Urgency Level: 
            <select name="urgency">
                <option value="Medium">Medium</option>
                <option value="High">High</option>
                <option value="Critical">Critical</option>
            </select>
        </label></p>
        <p><button type="submit" class="btn">Submit Blood Request</button></p>
    </form>
</div>
{% endblock %}
