{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Donor Registration</h2>
    <form method="POST">
        <p><label>Full Name: <input type="text" name="full_name" required></label></p>
        <p><label>Email Address: <input type="email" name="email" required></label></p>
        <p><label>Blood Type: 
            <select name="blood_type">
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>
        </label></p>
        <p><button type="submit" class="btn">Register as Donor</button></p>
    </form>
</div>
{% endblock %}
